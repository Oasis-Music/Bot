directive @hasRole(role: [Role!]!) on FIELD_DEFINITION | MUTATION | QUERY

type Query
type Mutation

scalar Date
scalar Upload

enum Role {
  ADMIN
  USER
}

type NotFound {
  message: String!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}
