type Soundtrack {
  id: ID!
  title: String!
  author: String!
  duration: Int!
  coverURL: String
  audioURL: String!
  validated: Boolean!
  creatorId: String! @hasRole(role: ADMIN)
  creator: User!
  createdAt: Date!
  attached: Boolean!
}

union SoundtrackResult = Soundtrack | NotFound # todo: del then
union SoundtrackPayload = Soundtrack | NotFound

extend type Query {
  soundtrack(id: ID!): SoundtrackPayload @hasRole(role: [ADMIN, USER])
  soundtracks(first: Int!, after: String, before: String, where: SoundtrackFilter): SoundtrackConnection!
  searchSoundtrack(value: String!): [Soundtrack!]! @hasRole(role: [ADMIN, USER])
  checkAudioHash(hash: String!): SoundtrackResult @hasRole(role: [ADMIN, USER])
}

extend type Mutation {
  createSoundtrack(input: CreateSoundtrackInput!): Boolean! @hasRole(role: [ADMIN, USER])
  deleteSoundtrack(id: ID!): Boolean! @hasRole(role: [ADMIN])
}

input CreateSoundtrackInput {
  title: String!
  author: String!
  coverImage: Upload
  audiofile: Upload!
  attach: Boolean!
}

type SoundtrackConnection {
  totalCount: Int!
  edges: [SoundtrackEdge!]!
  pageInfo: PageInfo!
}

type SoundtrackEdge {
  node: Soundtrack!
  cursor: String!
}

input SoundtrackFilter {
  duration: Int # plug filter value [ignore it for now]
}
